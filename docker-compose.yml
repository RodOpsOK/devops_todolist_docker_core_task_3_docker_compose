version: '3'

networks:
  app-network:
    driver: bridge
  
services:
  mysql-local:
    image: mysql-local:1.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: mysql-local
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

  todolist-app:
    image: todolist:2.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todolist-app
    ports:
      - "8080:8080"
    environment:
      - ENV=local
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - mysql-local
  
volumes:
  mysql-data:
